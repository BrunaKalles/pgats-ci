# CI de Nível 03 - Disparo após a conclusão de outra pipeline.

# nome da pipeline
name: 'Execução por deploy'

# gatilhos / triggers - regras de disparo
# gatilho manual= workflow dispatch
# gatilho por cronograma = schedule
# gatilho por conclusão de outra pipeline = workflow run

on:
    workflow_run:
      workflows: ['Execução Manual'] # nome da pipeline que deve ser concluída para disparar esta pipeline
      types:
        - completed # tipo de evento que deve ocorrer na pipeline anterior para disparar esta pipeline

# tarefas dentro da pipeline = jobs
jobs: 
    # nome do job
    e2e-tests:
        # maquina onde o job vai rodar
        runs-on: ubuntu-latest
    
        if: ${{github.event.workflow_run.conclusion == 'success'}} # condição para rodar o job somente se a pipeline anterior tiver sido concluída com sucesso        # passos do job
        steps:
            # clone do projeto
            - uses: actions/checkout@v4

            - name: Verificar máquina
              run: hostname
            # instalação do node
            -   uses: actions/setup-node@v4
                with:
                    node-version: 24.x  

            # instalação do yarn
            -   name: Instalando o Yarn
                run: npm install -g yarn

            # instalação das dependências
            -   name: Instalando as dependências
                run: yarn install

          # instalação dos browsers do playwright
            -   name: Instalando os browsers do Playwright
                run: yarn playwright install

            # execução dos testes e2e
            -   name: Executando os testes e2e
                run: yarn run e2e

            
            #- name: Mostrar results.xml
            #  if: always()
            #  run: |
            #    cat results.xml | head -20

            - name: Fazer upload do relatório do Playwright
              uses: actions/upload-artifact@v4
              if: always()
              with:
                name: playwright-report
                path: playwright-report/
                retention-days: 30

            