# CI de Nível 02 - execução agendada

# nome da pipeline
name: 'N2 - Execução Agendada'

# gatilhos / triggers - regras de disparo
# gatilho manual= workflow dispatch
# gatilho por cronograma = schedule

on:
  schedule:
    #crononograma de execução
    # 1º - minuto, 2º - hora,  3º - dia do mês, 4º - mês, 5º - dia da semana
    - cron: '*/30 * * *' # todos os dias, a cada 30 minutos
    #- cron: '0 0 * * 5' # toda sexta-feira, à meia-noite

# tarefas dentro da pipeline = jobs
jobs:
  # nome do job
  e2e-tests:
    # maquina onde o job vai rodar
    #runs-on: ubuntu-latest
    runs-on:
      - self-hosted
      - Windows
      - X64

    # passos do job
    steps:
      # clone do projeto
      - uses: actions/checkout@v4

      - name: Verificar máquina
        run: hostname
      # instalação do node
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # instalação do yarn
      - name: Instalando o Yarn
        run: npm install -g yarn

      # instalação das dependências
      - name: Instalando as dependências
        run: yarn install

      # instalação dos browsers do playwright
      - name: Instalando os browsers do Playwright
        run: yarn playwright install

      # execução dos testes e2e
      - name: Executando os testes e2e
        run: yarn run e2e

