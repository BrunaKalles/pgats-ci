# CI de Nível 01 - Disparo manual através de clique.

# nome da pipeline
name: 'Execução Manual'

# gatilhos / triggers - regras de disparo
# gatilho manual= workflow dispatch

on:
    workflow_dispatch:

# tarefas dentro da pipeline = jobs
jobs: 
    # nome do job
    e2e-tests:
        # maquina onde o job vai rodar
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest

        # passos do job
        steps:
            # clone do projeto
            - uses: actions/checkout@v4

            # instalação do node
            -   uses: actions/setup-node@v4
                with:
                    node-version: 24.x  

            # instalação do yarn
            -   name: Instalando o Yarn
                run: npm install -g yarn

            # instalação das dependências
            -   name: Instalando as dependências
                run: yarn install

          # instalação dos browsers do playwright
            -   name: Instalando os browsers do Playwright
                run: yarn playwright install

            # execução dos testes e2e
            -   name: Executando os testes e2e
                run: yarn run e2e

            - name: Relatório de resultado dos testes
              uses: test-summary/action@v2
              if: always() # Garante que o relatório rode mesmo se os testes falharem
              with:
                paths: '**/test-results/*.xml' # Ajuste para o caminho dos seus arquivos de teste